# dsh-plugin bundle patch（package.json 的 dsh.bundle.patch 指向本文件）
#
# 这个文件就是本插件作为一个「profile 层级」被装载的全部声明：一行 insert。
# 当插件通过官方 CLI 安装时——
#
#   dsh plugin --profile web add <spec>
#
# ——`dsh plugin` 会先把包交给 pnpm 装进 profile，然后**对账** `dsh.profile.bundles`：
# 只要包装了 dsh.bundle.patch，就把它的包名追加进层级列表（见
# apps/cli/src/plugin.ts 的 reconcilePlugins）。所以**不需要手改 profile 的任何文件**，
# 装完重启 `dsh web` 即生效。
#
# 阈值等配置写在下面这行的 config 里（或用环境变量覆盖，见 README）：
#
#   - insert:
#       - id: ask-timeout-notify
#         name: dsh-ask-timeout-notify
#         config:
#           timeoutMinutes: 60
#
- insert:
    - id: ask-timeout-notify
      name: dsh-ask-timeout-notify
